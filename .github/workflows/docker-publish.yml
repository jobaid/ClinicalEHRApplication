# Builds both images and pushes them to Docker Hub.
#
# Before this can run, add two repository secrets under
# GitHub → Settings → Secrets and variables → Actions:
#
#   DOCKERHUB_USERNAME   your Docker Hub username
#   DOCKERHUB_TOKEN      a Docker Hub *access token*, not your password
#                        (hub.docker.com → Account settings → Personal access tokens)
#
# Use a token because it is scopable and revocable on its own: if it leaks you revoke that one
# token, rather than changing the password protecting your whole Docker Hub account.
#
# Tags produced:
#   main branch  →  :latest and :main-<short-sha>
#   git tag v1.2.3 →  :1.2.3, :1.2, :latest
#
# A pull request builds but does NOT push. That matters for a public repository: a PR from a fork
# must never be able to publish an image under your name, and it cannot, because the push step is
# skipped and secrets are unavailable to fork PRs.

name: Publish Docker images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

# Two builds that do not depend on each other; a new push supersedes an in-flight run.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./server
            image: medbill-api
          - name: web
            context: .
            image: medbill-web

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped entirely on pull requests — see the note at the top.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

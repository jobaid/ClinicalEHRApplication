# Full local stack: PostgreSQL + Go API + nginx-served frontend.
#
#   cp .env.docker.example .env.docker
#   # fill in POSTGRES_PASSWORD and JWT_SECRET, then:
#   docker compose --env-file .env.docker up --build
#
# Then open http://localhost:8080. The API is reached through the same origin at /api.
#
# Compose's `${VAR:?message}` syntax refuses to start when a variable is unset, which matches how
# the API itself behaves under APP_ENV=production — the stack fails loudly on a missing secret
# instead of quietly running on a default that is printed in a public repository.

name: medbill

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medbill}
      POSTGRES_USER: ${POSTGRES_USER:-medbill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD — see .env.docker.example}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Postgres runs every .sql here in filename order, but ONLY when the data directory is
      # empty — i.e. the very first start. Adding a migration later does not re-run this; apply
      # it yourself with `docker compose exec -T db psql ...`, or drop the volume to rebuild.
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medbill} -d ${POSTGRES_DB:-medbill}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately publishes no port. The API reaches it over the private compose network, and
    # the database is not exposed to the host or the LAN. To inspect it, go through the container:
    #   docker compose exec db psql -U medbill -d medbill

  api:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-medbill}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-medbill}?sslmode=disable
      # Quoted because the message contains a colon-and-space, which YAML would otherwise read as
      # the start of a second mapping and refuse to parse the file at all.
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET - generate one with openssl rand -base64 48}"
      # Same-origin through nginx means CORS is never exercised, but the server requires the
      # variable under APP_ENV=production, so it is set to the origin people actually visit.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # First boot only. A new database has no accounts, and creating one requires being signed in
      # as a SUPER_ADMIN already — so without these a fresh deployment cannot be logged into at
      # all. Ignored once any account exists, so leaving them set opens no back door. Unset them
      # after the first sign-in anyway. See server/bootstrap.go.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # "all" (the default) sends every account through authenticator enrolment; "none" turns the
      # requirement off without deleting anyone's enrolment. Defaulting to "all" here means the
      # secure setting is what you get by forgetting to set it.
      #
      # This line was missing, so MFA_ENFORCEMENT in .env.docker was read by nothing and the
      # server always enforced MFA regardless of what the file said.
      MFA_ENFORCEMENT: ${MFA_ENFORCEMENT:-all}
      # The demonstration account. Unset means no demo account exists and the panel never appears
      # on the login page - which is the right default for a practice running real billing.
      # Setting both creates ONE extra MANAGER account whose password is published on the login
      # page and which skips authenticator verification. It can never overwrite a real user: see
      # ensureDemoUser in server/demo.go. Read section 26/27 of DEPLOYMENT.md before enabling it
      # on a database that holds real patient information.
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-Manager Demo}
      # Where Backup & Restore keeps its dump files. See the backup-data volume below.
      BACKUP_DIR: /var/lib/medbill/backups
    volumes:
      # Backups live on their own volume, deliberately NOT inside db-data. A backup stored inside
      # the thing it is backing up is not a backup: one `docker compose down -v` would destroy the
      # database and every copy of it in the same breath.
      - backup-data:/var/lib/medbill/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Also unpublished: the browser talks to /api through nginx, so nothing needs port 8080 from
    # outside. Publish it only if you are pointing a separately hosted frontend at this API.

  web:
    build:
      context: .
      args:
        # Empty = same origin, so the bundle requests /api/... from whatever host serves it.
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  db-data:
  backup-data:

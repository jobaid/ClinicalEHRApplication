# Serves the built SPA and proxies the API onto the same origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version on errors and in the Server header.
    server_tokens off;

    # Applied to every response, error pages included — hence `always`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames (index-CSl6GdmT.js) can be cached forever; the HTML that names them cannot,
    # or a returning visitor keeps loading the previous deploy's asset list.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The API on the same origin. This is what makes CORS a non-issue in the container setup:
    # the browser sees one origin, so no preflight and no CORS_ORIGINS to get wrong in production.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /api/stream is a Server-Sent Events feed that stays open for the life of the
        # session — it is how the app replaces Firestore's onSnapshot. nginx buffers proxied
        # responses by default, which would hold events back until the buffer filled and make
        # live updates look broken, so buffering is off and the read timeout is long.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Connection "";
    }

    # Client-side routes are not files on disk; serve the app shell and let it route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

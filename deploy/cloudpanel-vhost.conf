# CloudPanel reverse-proxy vhost for this application.
#
# CloudPanel generates its own vhost when you create a "Reverse Proxy" site, and that generated
# config BUFFERS proxied responses. This application will appear to work with it and then quietly
# stop updating, because GET /api/stream is a Server-Sent Events feed that is held open for the
# life of the session — it is what replaced Firestore's onSnapshot. A buffering proxy holds those
# events back until its buffer fills, so the page loads, the data is correct once, and then
# nothing ever changes again. That is the single easiest thing to get wrong here.
#
# HOW TO USE
#   CloudPanel -> your site -> Vhost, find the `location / { ... }` block that CloudPanel wrote,
#   and replace it with the two location blocks below. Leave everything else CloudPanel generated
#   (the listen lines, the Let's Encrypt certificate paths, its own includes) exactly as it is.
#
# Assumes the compose stack is published on 127.0.0.1:8080 — i.e. WEB_PORT=127.0.0.1:8080 in
# .env.docker, which keeps it unreachable except through this proxy.

# =============================================================================
# EASIEST OPTION - add six lines, replace nothing
# =============================================================================
#
# If editing the generated vhost feels risky, don't replace anything. Open
# CloudPanel -> your site -> Vhost, find the block containing `proxy_pass`, and paste these
# six lines just before that block's closing brace:
#
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";
#     proxy_buffering off;
#     proxy_cache off;
#     proxy_read_timeout 24h;
#     client_max_body_size 25m;
#
# Leave every other line CloudPanel wrote exactly as it is - the listen lines, the certificate
# paths, its includes. Then, on the server:
#
#     nginx -t && systemctl reload nginx
#
# `nginx -t` must print "syntax is ok" and "test is successful" BEFORE you reload.
#
# That is enough to fix the problem. It turns buffering off for static assets too, which costs a
# little efficiency on a busy site and nothing noticeable on a clinic-sized one.
#
# The two blocks below are the tidier version: they scope the streaming settings to /api/stream
# alone and leave normal buffering in place for everything else. Use them if you are comfortable
# replacing CloudPanel's `location /` block outright.
#
# =============================================================================


# --- the live event stream -------------------------------------------------
# `location = ` is an exact match, which nginx resolves before any prefix location, so this wins
# for /api/stream while everything else falls through to the block below. Location matching
# ignores the query string, so it still applies to /api/stream?foo=bar.
location = /api/stream {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # The three that matter. Without them the feed is buffered and live updates stop working.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
}

# --- everything else: the SPA and the rest of the API ----------------------
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Statements and report PDFs are generated on demand and can take a few seconds on a large
    # date range; the default 60s is enough but leaves little room on a small VPS.
    proxy_read_timeout 300s;

    # Uploaded insurance cards and ID documents are posted as base64 JSON, which inflates them by
    # about a third. CloudPanel's default client_max_body_size is smaller than a phone photo.
    client_max_body_size 25m;
}
